<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuDu app</title>
    <script src="./src/main.js" type="module" defer></script>
  </head>
  <body>
    <h2 class="app-title">TuDu App</h2>

    <main>
      <aside>
        <div class="todo-classification">
          <li class="list classification-list">Inbox</li>
          <li class="list classification-list">Today</li>
          <li class="list classification-list">This week</li>
          <li class="list classification-list">This month</li>
        </div>

        <div class="project-classification">
          <h3>Projects</h3>
          <button type="button" class="btn add-project">+ New Project</button>
        </div>
      </aside>
      <div class="content">
        <h2 class="content-title">Inbox</h2>
        <button type="button" class="btn add-task">+ New Task</button>
      </div>
    </main>
  </body>
</html>
